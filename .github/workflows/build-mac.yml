name: Build macOS packages

on:
  workflow_dispatch:
    inputs:
      app_env:
        description: '打包环境'
        required: true
        type: choice
        options:
          - development
          - production
        default: production
      signing_mode:
        description: 'unsigned：无需证书，手动升级；signed：签名公证，支持自动更新'
        required: true
        type: choice
        options:
          - unsigned
          - signed
        default: unsigned

permissions:
  contents: read

jobs:
  build-mac:
    runs-on: macos-15
    timeout-minutes: 60

    env:
      APP_ENV: ${{ inputs.app_env == 'development' && 'development' || 'prod' }}
      MAC_OUTPUT_DIR: ${{ inputs.signing_mode == 'unsigned' && 'release/mac-unsigned' || 'release' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.21.1'
          cache: yarn

      - name: Enable Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Check environment
        if: ${{ inputs.signing_mode == 'signed' }}
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          node --input-type=module -e '
            for (const name of ["CSC_LINK", "CSC_KEY_PASSWORD", "APPLE_ID", "APPLE_APP_SPECIFIC_PASSWORD", "APPLE_TEAM_ID"]) {
              if (!process.env[name]) throw new Error(`Missing required secret: ${name}`)
            }
          '

      - name: Build frontend
        run: yarn build-only --mode ${{ inputs.app_env == 'development' && 'development' || 'prod' }}

      - name: Build Electron main process
        run: yarn build:electron

      - name: Package signed macOS
        if: ${{ inputs.signing_mode == 'signed' }}
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: yarn electron-builder --config build.config.js --mac --publish never

      - name: Package macOS without Apple credentials
        if: ${{ inputs.signing_mode == 'unsigned' }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: yarn electron-builder --config build.mac-unsigned.config.js --mac --publish never

      - name: Check macOS artifacts
        run: |
          set -euo pipefail
          for arch in x64 arm64; do
            test -n "$(find "$MAC_OUTPUT_DIR" -maxdepth 1 -name "*-${arch}.zip" -print -quit)"
            test -n "$(find "$MAC_OUTPUT_DIR" -maxdepth 1 -name "*-${arch}.dmg" -print -quit)"
          done

      - name: Verify signed updates
        if: ${{ inputs.signing_mode == 'signed' }}
        run: |
          set -euo pipefail
          test -s "$MAC_OUTPUT_DIR/latest-mac.yml"
          for arch in x64 arm64; do
            grep -q -- "-${arch}.zip" "$MAC_OUTPUT_DIR/latest-mac.yml"
          done
          while IFS= read -r -d '' app_path; do
            codesign --verify --deep --strict --verbose=2 "$app_path"
            spctl --assess --type execute --verbose=2 "$app_path"
            xcrun stapler validate "$app_path"
            test -s "$app_path/Contents/Resources/app-update.yml"
          done < <(find "$MAC_OUTPUT_DIR" -maxdepth 2 -name '*.app' -print0)

      - name: Verify manual distribution
        if: ${{ inputs.signing_mode == 'unsigned' }}
        run: |
          set -euo pipefail
          test ! -e "$MAC_OUTPUT_DIR/latest-mac.yml"
          while IFS= read -r -d '' app_path; do
            test ! -e "$app_path/Contents/Resources/app-update.yml"
          done < <(find "$MAC_OUTPUT_DIR" -maxdepth 2 -name '*.app' -print0)

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: macOS-${{ inputs.app_env }}-${{ inputs.signing_mode }}
          path: |
            ${{ env.MAC_OUTPUT_DIR }}/*.dmg
            ${{ env.MAC_OUTPUT_DIR }}/*.zip
            ${{ env.MAC_OUTPUT_DIR }}/*.yml
            ${{ env.MAC_OUTPUT_DIR }}/*.blockmap
          if-no-files-found: error
          retention-days: 7
